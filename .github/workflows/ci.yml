name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

  temporal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # No setup-temporal action: TestWorkflowEnvironment.createLocal() downloads
      # its own server. The v0.1.0 action also broke (script not found in caller cwd).
      - name: Build packages needed by Temporal workers
        run: pnpm --filter @anyagent/harness --filter @anyagent/workflows --filter @anyagent/node --filter anyagent build

      - name: Temporal workflow tests
        run: pnpm --filter @anyagent/workflows test

      - name: Node AnyBot e2e (fakes)
        run: pnpm --filter @anyagent/node test

      - name: WP8 acceptance suite (fakes)
        run: pnpm --filter @anyagent/e2e test
